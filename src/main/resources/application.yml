spring:
  application:
    name: video-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:videos}
    username: ${DB_USER:video_user}
    password: ${DB_PASSWORD:video_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/fiapx}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/fiapx/protocol/openid-connect/certs}
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 10MB

server:
  port: ${SERVER_PORT:8082}
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never

# MinIO / S3 Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:fiapx-videos}
  secure: ${MINIO_SECURE:false}
  paths:
    uploads: uploads/
    zips: zips/

# RabbitMQ Exchange/Queue Configuration
rabbitmq:
  exchange:
    name: fiapx.video
    type: topic
  queues:
    video-uploaded: video.processing
    video-status: video.status
    video-dlq: video.processing.dlq
  routing-keys:
    video-uploaded: video.uploaded
    processing-completed: video.processing.completed
    processing-failed: video.processing.failed

# Cache Configuration
cache:
  ttl:
    video-list: 60  # seconds
    video-detail: 300  # seconds

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.fiapx.video: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/video-service.log
    max-size: 10MB
    max-history: 30

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: FIAP X Video Processing - Video Service
    version: 1.0.0
